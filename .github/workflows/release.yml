name: Release

# Builds, signs, notarizes and staples the DMG with scripts/release.sh, launches it once (scripts/smoke-launch.sh) and
# attaches it with its .sha256 and the dSYMs to a draft GitHub release for the tag it runs on. Run it on a pushed
# tag: `gh workflow run release.yml --ref vX.Y.Z`. CONTRIBUTING.md#releasing lists the secrets and the checks before
# publishing the draft.
#
# Manual, so a tag pushed for a release built locally doesn't start a second one.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and the tags: release.sh compares the build number with the previous v*.*.* tag.
          fetch-depth: 0
          # The job writes the release through `gh` with GH_TOKEN; git itself needs no credentials.
          persist-credentials: false

      - name: Check the tag and the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [[ $GITHUB_REF_TYPE == tag ]] ||
            { echo "::error::Run this on a tag: gh workflow run release.yml --ref vX.Y.Z"; exit 1; }
          version=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' project.yml | head -n 1)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] ||
            { echo "::error::The tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"; exit 1; }
          missing=0
          for name in APPLE_TEAM_ID DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n ${!name} ]] || { echo "::error::secret $name is not set"; missing=1; }
          done
          exit "$missing"

      # The revision being released passes the tests first, as test.yml runs them on the same runner: a failing
      # `swift test` stops the release before anything is built or signed. It restores test.yml's build cache and
      # saves none of its own.
      - name: Identify the toolchain
        id: toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      # MLX's Metal shaders (SwapjutsuMLX, the local prompt writer) need the Metal Toolchain, a separate download
      # since Xcode 26.
      - name: Install the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Run the tests
        timeout-minutes: 12
        # Without the MLX trait, as test.yml; SwiftPM then drops Package.resolved, which the release build needs back.
        run: |
          swift test --disable-default-traits
          git checkout -- Package.resolved

      - name: Set signing paths on the runner
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >>"$GITHUB_ENV"
          echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a dialog nobody could answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          # Added to the search list, where release.sh finds the identity with `security find-identity`.
          keychains=("$KEYCHAIN")
          while IFS= read -r keychain; do keychains+=("$keychain"); done < <(
            security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "${keychains[@]}"

      - name: Write the notarization key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" >"$NOTARY_KEY"

      - name: Build, sign, notarize
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -version
          scripts/release.sh

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "Swapjutsu $version" \
            "build/Swapjutsu-$version.dmg" "build/Swapjutsu-$version.dmg.sha256" \
            "build/Swapjutsu-$version-dSYMs.zip"

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$NOTARY_KEY" "$RUNNER_TEMP/developer-id.p12"
